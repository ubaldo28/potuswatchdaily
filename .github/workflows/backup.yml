name: Backup articles table

on:
  schedule:
    - cron: '0 6 * * *'   # 06:00 UTC daily
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22

      # A fork, or this repo before its secrets are configured, cannot reach the
      # database. That is not a backup failure and should not look like one: the
      # first version of this workflow failed red every morning for four days
      # because the secrets were never set, which trains you to ignore the red.
      # Missing config is a warning and a clean exit; a backup that runs and goes
      # wrong is still a hard failure.
      - name: Check configuration
        id: cfg
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        run: |
          # Reading is all this job does, so it uses the publishable key from
          # project.config.json -- no secret needed for a backup of public rows.
          # The key comes from a committed file, so it is always set; only the
          # URL can be missing.
          if [ -z "$SUPABASE_URL" ]; then
            echo "::warning::SUPABASE_URL is not set on this repository — skipping the backup. Add it under Settings → Secrets and variables → Actions."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Dump articles table
        if: steps.cfg.outputs.ready == 'true'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        run: |
          export SUPABASE_KEY=$(node -p "require('./project.config.json').supabase.publishableKey")
          node scripts/backup-articles.mjs

      # Uploaded as a workflow artifact, NOT committed.
      #
      # Committing a ~25 MB JSON dump every day put 71 MB of database snapshots
      # in the working tree and grew the git pack by several megabytes a day,
      # permanently, for a project whose actual source is under 1 MB. Anyone
      # cloning this repository was downloading the database three times over.
      # Artifacts expire on their own and are downloadable from the run page.
      - name: Upload the snapshot
        if: steps.cfg.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: articles-${{ github.run_id }}
          path: backups/
          retention-days: 30
          if-no-files-found: error
