name: Backup articles table

on:
  schedule:
    - cron: '0 6 * * *'   # 06:00 UTC daily
  workflow_dispatch:

permissions:
  contents: write

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # A fork, or this repo before its secrets are configured, cannot reach the
      # database. That is not a backup failure and should not look like one: the
      # first version of this workflow failed red every morning for four days
      # because the secrets were never set, which trains you to ignore the red.
      # Missing config is a warning and a clean exit; a backup that runs and goes
      # wrong is still a hard failure.
      - name: Check configuration
        id: cfg
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          # Reading is all this job does, so it prefers the read-only key and
          # only falls back to the write key when no read key is configured.
          SUPABASE_READ_KEY: ${{ secrets.SUPABASE_READ_KEY }}
          SUPABASE_WRITE_KEY: ${{ secrets.SUPABASE_WRITE_KEY }}
        run: |
          KEY="${SUPABASE_READ_KEY:-$SUPABASE_WRITE_KEY}"
          if [ -z "$SUPABASE_URL" ] || [ -z "$KEY" ]; then
            echo "::warning::SUPABASE_URL and a Supabase key are not both set on this repository — skipping the backup. Add them under Settings → Secrets and variables → Actions. The read-only publishable key is sufficient."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Dump articles table
        if: steps.cfg.outputs.ready == 'true'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_READ_KEY || secrets.SUPABASE_WRITE_KEY }}
        run: node scripts/backup-articles.mjs

      - name: Keep the 14 most recent daily snapshots
        if: steps.cfg.outputs.ready == 'true'
        run: |
          ls -1 backups/articles-*.json 2>/dev/null | sort | head -n -14 | xargs -r rm --

      - name: Commit snapshot
        if: steps.cfg.outputs.ready == 'true'
        run: |
          git config user.name  "potuswatch-backup"
          git config user.email "actions@github.com"
          git add backups/
          git diff --staged --quiet || git commit -m "backup: articles table $(date -u +%Y-%m-%d) ($(cat backups/LATEST-COUNT.txt | tr -d '\n') rows)"
          git push
