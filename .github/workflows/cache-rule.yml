name: Apply Cloudflare Cache Rule

# Does the whole job from GitHub Secrets — no key ever has to be fetched or
# pasted by hand. Applies the Cache Rule that makes Cloudflare actually cache
# HTML from the Pages Function, then writes the purge credentials into the
# generator Worker so purge-on-publish works. Idempotent.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Apply cache rule and capture zone id
        id: rule
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          node scripts/setup-cache-rule.mjs | tee out.txt
          ZONE=$(grep -o 'CF_ZONE_ID=[a-f0-9]*' out.txt | cut -d= -f2)
          echo "zone_id=$ZONE" >> "$GITHUB_OUTPUT"
          echo "Zone: $ZONE"

      # wrangler authenticates from CLOUDFLARE_API_TOKEN, the same token
      # deploy.yml uses, so no extra credential is needed.
      - name: Set Worker purge secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          # No CLOUDFLARE_ACCOUNT_ID here on purpose. When it was a repository
          # secret it held a stale value, wrangler preferred it over the account
          # pinned in worker/wrangler.jsonc, and every run failed with a generic
          # "Authentication error [code: 10000]" that pointed at the token
          # instead of at the account. The account now lives in exactly one
          # place -- the wrangler config -- and scripts/check-config.mjs fails
          # the build if any file disagrees with it.
          # Via env, never interpolated straight into the shell.
          ZONE_ID: ${{ steps.rule.outputs.zone_id }}
        run: |
          set -e
          printf '%s' "$ZONE_ID"              | npx --yes wrangler@4 secret put CF_ZONE_ID     --config worker/wrangler.jsonc
          printf '%s' "$CLOUDFLARE_API_TOKEN" | npx --yes wrangler@4 secret put CF_PURGE_TOKEN --config worker/wrangler.jsonc
          echo "Purge secrets set."
