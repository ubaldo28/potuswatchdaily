name: Build & Deploy to Cloudflare Workers

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      # A deploy that cannot authenticate should say so in one line, not bury it
      # in a wrangler stack trace. Unlike the backup job this still fails hard:
      # the live site depends on it, so a skipped deploy must never look like a
      # successful one.
      - name: Check deploy credentials
        env:
          CLOUDFLARE_API_KEY: ${{ secrets.CLOUDFLARE_API_KEY }}
          CLOUDFLARE_EMAIL: ${{ secrets.CLOUDFLARE_EMAIL }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          missing=
          [ -z "$CLOUDFLARE_API_KEY" ]    && missing="$missing CLOUDFLARE_API_KEY"
          [ -z "$CLOUDFLARE_EMAIL" ]      && missing="$missing CLOUDFLARE_EMAIL"
          [ -z "$CLOUDFLARE_ACCOUNT_ID" ] && missing="$missing CLOUDFLARE_ACCOUNT_ID"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secret(s):$missing — add them under Settings → Secrets and variables → Actions."
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Build Astro site
        run: npm run build

      # SUPABASE_URL / SUPABASE_KEY are Worker secrets, not build-time env:
      # since @astrojs/cloudflare v14 the pages read them from the
      # `cloudflare:workers` module at request time. Set them once with
      #   npx wrangler secret put SUPABASE_URL
      #   npx wrangler secret put SUPABASE_KEY
      # They are NOT re-uploaded here, so a deploy can never clobber them.
      - name: Deploy to Cloudflare Workers
        run: npx wrangler deploy --config dist/server/wrangler.json
        env:
          CLOUDFLARE_API_KEY: ${{ secrets.CLOUDFLARE_API_KEY }}
          CLOUDFLARE_EMAIL: ${{ secrets.CLOUDFLARE_EMAIL }}
          # Explicit: the Global API Key can see more than one account, and
          # wrangler errors out rather than guessing which one to deploy to.
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
