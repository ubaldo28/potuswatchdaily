name: Build & Deploy to Cloudflare Workers

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      # A deploy that cannot authenticate should say so in one line, not bury it
      # in a wrangler stack trace. Unlike the backup job this still fails hard:
      # the live site depends on it, so a skipped deploy must never look like a
      # successful one.
      - name: Check deploy credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          missing=
          [ -z "$CLOUDFLARE_API_TOKEN" ]  && missing="$missing CLOUDFLARE_API_TOKEN"
          [ -z "$CLOUDFLARE_ACCOUNT_ID" ] && missing="$missing CLOUDFLARE_ACCOUNT_ID"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secret(s):$missing — add them under Settings → Secrets and variables → Actions."
            exit 1
          fi

          # Verify the token before spending a build on it. Cloudflare's own
          # verify endpoint answers in one call, and a bad paste (truncated,
          # wrong value, stray whitespace) is indistinguishable from a
          # permissions problem once wrangler is involved -- it reports both as
          # an authentication error deep in a deploy log. Only the status and
          # Cloudflare's message are printed; the token itself never is.
          code=$(curl -s -o /tmp/cf-verify.json -w '%{http_code}' \
            https://api.cloudflare.com/client/v4/user/tokens/verify \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN")
          echo "token verify -> HTTP $code"
          if [ "$code" != "200" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN was rejected by Cloudflare (HTTP $code): $(sed -n 's/.*\"message\":\"\([^\"]*\)\".*/\1/p' /tmp/cf-verify.json | head -1). The secret is not a usable token — re-copy it and update the secret."
            exit 1
          fi
          echo "Token is valid."

          # Length is printed, never the value: a truncated paste is the single
          # most common cause and shows up here immediately.
          echo "token length: ${#CLOUDFLARE_API_TOKEN} characters (expected ~40)"

      - name: Install dependencies
        run: npm ci

      - name: Build Astro site
        run: npm run build

      # SUPABASE_URL / SUPABASE_KEY are Worker secrets, not build-time env:
      # since @astrojs/cloudflare v14 the pages read them from the
      # `cloudflare:workers` module at request time. Set them once with
      #   npx wrangler secret put SUPABASE_URL
      #   npx wrangler secret put SUPABASE_KEY
      # They are NOT re-uploaded here, so a deploy can never clobber them.
      - name: Deploy to Cloudflare Workers
        run: npx wrangler deploy --config dist/server/wrangler.json
        env:
          # A scoped token, not the Global API Key: it is limited to editing
          # Workers on one account, and Cloudflare no longer surfaces the
          # Global Key in the dashboard at all. Revoking it costs nothing.
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          # Explicit: a token may be scoped to more than one account, and
          # wrangler errors out rather than guessing which one to deploy to.
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
