name: Build & Deploy to Cloudflare Workers

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      # Runs before anything is installed, built or deployed, because it is the
      # cheapest check in the pipeline and it catches the failure that has cost
      # the most time on this project: an identifier -- a Cloudflare account, a
      # Worker name, a workers.dev hostname -- that is written in two files and
      # only correct in one. Those never fail loudly. They deploy fine, into the
      # wrong place, and the monitor keeps reporting green.
      - name: Check that the repository agrees with itself
        run: node scripts/check-config.mjs

      # A deploy that cannot authenticate should say so in one line, not bury it
      # in a wrangler stack trace. Unlike the backup job this still fails hard:
      # the live site depends on it, so a skipped deploy must never look like a
      # successful one.
      - name: Check deploy credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          missing=
          [ -z "$CLOUDFLARE_API_TOKEN" ]  && missing="$missing CLOUDFLARE_API_TOKEN"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secret(s):$missing — add them under Settings → Secrets and variables → Actions."
            exit 1
          fi

          # Length first, and unconditionally: it is the one diagnostic that
          # distinguishes a truncated paste from a wrong value, and printing it
          # only on success meant the failing case -- the case that matters --
          # never showed it. The value itself is never printed.
          echo "token length: ${#CLOUDFLARE_API_TOKEN} characters (a Cloudflare token is ~40)"

          # Verify the token before spending a build on it. Cloudflare's own
          # verify endpoint answers in one call, and a bad paste (truncated,
          # wrong value, stray whitespace) is indistinguishable from a
          # permissions problem once wrangler is involved -- it reports both as
          # an authentication error deep in a deploy log. Only the status and
          # Cloudflare's message are printed; the token itself never is.
          code=$(curl -s -o /tmp/cf-verify.json -w '%{http_code}' \
            https://api.cloudflare.com/client/v4/user/tokens/verify \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN")
          echo "token verify -> HTTP $code"
          if [ "$code" != "200" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN was rejected by Cloudflare (HTTP $code): $(sed -n 's/.*\"message\":\"\([^\"]*\)\".*/\1/p' /tmp/cf-verify.json | head -1). The secret is not a usable token — re-copy it and update the secret."
            exit 1
          fi
          echo "Token is valid."

      - name: Install dependencies
        run: npm ci

      - name: Build Astro site
        run: npm run build

      # SUPABASE_URL / SUPABASE_KEY are Worker secrets, not build-time env:
      # since @astrojs/cloudflare v14 the pages read them from the
      # `cloudflare:workers` module at request time. Set them once with
      #   npx wrangler secret put SUPABASE_URL
      #   npx wrangler secret put SUPABASE_KEY
      # They are NOT re-uploaded here, so a deploy can never clobber them.
      - name: Deploy the site Worker
        run: npx wrangler deploy --config dist/server/wrangler.json
        env:
          # A scoped token, not the Global API Key: it is limited to editing
          # Workers on one account, and Cloudflare no longer surfaces the
          # Global Key in the dashboard at all. Revoking it costs nothing.
          # The account is pinned in wrangler.jsonc, not passed here, so CI and
          # a local deploy cannot disagree about where this Worker goes.
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      # Everything the generator needs to run lives in this repository or in
      # GitHub Secrets -- nothing lives only on a laptop. A wiped or recreated
      # Worker is fully restored by one push: code, cron trigger, and the three
      # secrets below. This exists because the generator previously depended on
      # state that existed nowhere but one machine and one Cloudflare account,
      # and when that went away there was no way to rebuild it.
      - name: Deploy the generator Worker
        run: npx wrangler deploy --config worker/wrangler.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      # Pushed on every deploy, not once by hand. `wrangler secret put` is
      # idempotent, so re-running costs nothing and a Worker can never drift
      # into the half-configured state that looks alive and writes nothing.
      - name: Provision the generator's secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_WRITE_KEY: ${{ secrets.SUPABASE_WRITE_KEY }}
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
        run: |
          set -e
          if [ -z "$SUPABASE_WRITE_KEY" ]; then
            echo "::error::SUPABASE_WRITE_KEY is not set on this repository. The generator writes to Supabase, so it needs the service_role key -- the read-only publishable key cannot insert rows. Add it under Settings → Secrets and variables → Actions."
            exit 1
          fi
          printf '%s' "$SUPABASE_URL"        | npx wrangler secret put SUPABASE_URL        --config worker/wrangler.jsonc
          printf '%s' "$SUPABASE_WRITE_KEY"  | npx wrangler secret put SUPABASE_KEY        --config worker/wrangler.jsonc
          if [ -n "$UNSPLASH_ACCESS_KEY" ]; then
            printf '%s' "$UNSPLASH_ACCESS_KEY" | npx wrangler secret put UNSPLASH_ACCESS_KEY --config worker/wrangler.jsonc
          else
            echo "::warning::UNSPLASH_ACCESS_KEY not set — the generator will fall back to government photo feeds only."
          fi
          echo "Generator secrets provisioned."

      # The site only ever reads published articles, so it runs on the
      # publishable key -- the one Supabase says is safe in a browser. Keeping
      # the site off the privileged key means a mistake in a page template
      # cannot expose or change anything the public should not see, and it lets
      # the legacy service_role JWT be switched off entirely.
      #
      # Only provisioned when SUPABASE_READ_KEY is actually set, so a repository
      # that has not configured it keeps whatever the site Worker already has
      # rather than having its working secret replaced with an empty string.
      - name: Provision the site's read key
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_READ_KEY: ${{ secrets.SUPABASE_READ_KEY }}
        run: |
          set -e
          if [ -z "$SUPABASE_READ_KEY" ]; then
            echo "::warning::SUPABASE_READ_KEY is not set — leaving the site Worker's existing Supabase secrets alone."
            exit 0
          fi
          printf '%s' "$SUPABASE_URL"      | npx wrangler secret put SUPABASE_URL --config dist/server/wrangler.json
          printf '%s' "$SUPABASE_READ_KEY" | npx wrangler secret put SUPABASE_KEY --config dist/server/wrangler.json
          echo "Site read key provisioned."

      # Proves the deploy produced a working generator instead of assuming it.
      # A Worker that answers /health with real data is reachable, authenticated
      # against Supabase, and running current code; anything less fails here
      # rather than at 3am.
      - name: Verify the generator answers
        run: |
          sleep 5
          URL=$(node -p "require('./project.config.json').workers.generator.healthUrl")
          BODY=$(curl -sS --max-time 30 "$URL" || true)
          echo "$BODY"
          case "$BODY" in
            *last_article_minutes_ago*) echo "Generator is reachable and can read the database." ;;
            *) echo "::error::Generator deployed but /health returned no article data: $BODY"; exit 1 ;;
          esac

      # The site's key was just replaced, so prove the front page still renders
      # real articles rather than finding out from a reader.
      - name: Verify the site still serves articles
        run: |
          DOMAIN=$(node -p "require('./project.config.json').site.domain")
          BODY=$(curl -sSL --max-time 30 "https://$DOMAIN/" || true)
          SIZE=${#BODY}
          echo "https://$DOMAIN/ returned $SIZE bytes"
          if [ "$SIZE" -lt 2000 ]; then
            echo "::error::The site returned almost nothing ($SIZE bytes). The Supabase read key is probably wrong."
            exit 1
          fi
          case "$BODY" in
            *article*) echo "Front page is rendering articles." ;;
            *) echo "::error::The site rendered, but with no article markup on it."; exit 1 ;;
          esac
