name: Generator health check

# The generator died silently at 00:41 UTC on 2026-08-29 (revoked API key) and
# nobody noticed for four hours. The Worker exposes /health; nothing polled it.
# This does. A failed run emails the repo owner via GitHub's normal
# workflow-failure notification.

on:
  schedule:
    - cron: '25 * * * *'   # hourly, off the hour so it never races the generator.
                          # Was every 3h; that is 3h of silent downtime per miss.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      # The URL is hardcoded on purpose. It was a repo secret, the secret was
      # never set, and every run of this workflow failed on that instead of on
      # the thing it was built to watch -- so the generator sat broken for hours
      # with a monitor that looked like it was running. /health exposes no
      # secrets: a status string and the age of the newest article.
      #
      # This is the hostname of the Worker that actually holds the cron and
      # writes articles. Same-named copies exist elsewhere; pointing the monitor
      # at one of those makes it report on something nobody deploys to, which is
      # worse than no monitor because it looks like one.
      - name: Poll the generator health endpoint
        run: |
          URL="https://potuswatch-generator.peakvending.workers.dev/health"
          BODY=$(curl -sS --max-time 30 "$URL") || { echo "::error::Health endpoint unreachable at $URL"; exit 1; }
          echo "$BODY"

          STATUS=$(echo "$BODY" | sed -n 's/.*"status":"\([^"]*\)".*/\1/p')
          MINS=$(echo "$BODY"   | sed -n 's/.*"last_article_minutes_ago":\([0-9]*\).*/\1/p')

          if [ "$STATUS" != "ok" ]; then
            echo "::error::Generator is $STATUS — last article ${MINS:-unknown} minutes ago. Check: npx wrangler tail --config worker/wrangler.jsonc"
            exit 1
          fi

          echo "Healthy — last article ${MINS} minutes ago."
