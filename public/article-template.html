<!--
  Template for article pages served at /article/{slug}.
  All {{...}} placeholders are server-substituted from the article record.
  The fields used: title, excerpt, slug, region, hero_image, body, date (ISO 8601),
                   modified (ISO 8601, optional), author, sources (array of {title,url}).
  If a field is missing, fall back to sensible defaults (commented inline).
-->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">

    <!-- Per-article title + meta -->
    <title>{{title}} | POTUS Watch Daily</title>
    <meta name="description" content="{{excerpt}}">
    <meta name="author" content="{{author|default:'POTUS Watch Editorial'}}">
    <meta name="robots" content="index, follow, max-image-preview:large">
    <meta name="news_keywords" content="{{region}}, foreign policy, geopolitics">

    <!-- Per-article canonical -->
    <link rel="canonical" href="https://potuswatchdaily.com/article/{{slug}}">

    <!-- Sitemap + RSS -->
    <link rel="sitemap" type="application/xml" href="/sitemap.xml">
    <link rel="alternate" type="application/rss+xml" title="POTUS Watch Daily" href="/feed.xml">

    <!-- Per-article OpenGraph -->
    <meta property="og:type" content="article">
    <meta property="og:title" content="{{title}}">
    <meta property="og:description" content="{{excerpt}}">
    <meta property="og:url" content="https://potuswatchdaily.com/article/{{slug}}">
    <meta property="og:site_name" content="POTUS Watch Daily">
    <meta property="og:image" content="{{hero_image|default:'https://potuswatchdaily.com/og-default.jpg'}}">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:locale" content="en_US">
    <meta property="article:published_time" content="{{date}}">
    <meta property="article:modified_time" content="{{modified|default:date}}">
    <meta property="article:author" content="{{author|default:'POTUS Watch Editorial'}}">
    <meta property="article:section" content="{{region}}">
    <meta property="article:tag" content="{{region}}">

    <!-- Per-article Twitter card -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="{{title}}">
    <meta name="twitter:description" content="{{excerpt}}">
    <meta name="twitter:image" content="{{hero_image|default:'https://potuswatchdaily.com/og-default.jpg'}}">
    <!-- Optional: <meta name="twitter:site" content="@yourhandle"> -->

    <!-- JSON-LD: NewsArticle (REQUIRED for Google News + Top Stories) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "NewsArticle",
      "mainEntityOfPage": {
        "@type": "WebPage",
        "@id": "https://potuswatchdaily.com/article/{{slug}}"
      },
      "headline": "{{title|escape_quotes}}",
      "description": "{{excerpt|escape_quotes}}",
      "image": [
        "{{hero_image|default:'https://potuswatchdaily.com/og-default.jpg'}}"
      ],
      "datePublished": "{{date}}",
      "dateModified": "{{modified|default:date}}",
      "author": [{
        "@type": "Person",
        "name": "{{author|default:'POTUS Watch Editorial'}}",
        "url": "https://potuswatchdaily.com/about.html"
      }],
      "publisher": {
        "@type": "NewsMediaOrganization",
        "name": "POTUS Watch Daily",
        "logo": {
          "@type": "ImageObject",
          "url": "https://potuswatchdaily.com/logo.png",
          "width": 600,
          "height": 60
        }
      },
      "articleSection": "{{region}}"
    }
    </script>

    <!-- JSON-LD: BreadcrumbList -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "BreadcrumbList",
      "itemListElement": [{
        "@type": "ListItem",
        "position": 1,
        "name": "Home",
        "item": "https://potuswatchdaily.com/"
      },{
        "@type": "ListItem",
        "position": 2,
        "name": "{{region}}",
        "item": "https://potuswatchdaily.com/?region={{region}}"
      },{
        "@type": "ListItem",
        "position": 3,
        "name": "{{title|escape_quotes}}"
      }]
    }
    </script>

    <!-- Same fonts/styles/AdSense/GA you use on the homepage -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Inter:wght@300;400;500;600&display=swap">

    <script async src="https://www.googletagmanager.com/gtag/js?id=G-FRVP4L2Z2T"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);}
        gtag('js', new Date());
        gtag('config', 'G-FRVP4L2Z2T');
    </script>

    <meta name="google-adsense-account" content="ca-pub-7380718671497895">
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-7380718671497895" crossorigin="anonymous"></script>

    <!-- Reuse the homepage <style> block so the article matches the design -->
</head>
<body>
    <!-- Re-use homepage masthead/nav for consistency -->

    <article>
        <!-- Hero image (above the fold) -->
        <div class="article-hero-wrap">
            <img class="article-hero-img" src="{{hero_image}}" alt="{{title}}" fetchpriority="high">
            <div class="article-hero-gradient"></div>
        </div>

        <div class="article-content">
            <a class="back-btn" href="/" rel="up">
                <svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg>
                Back to feed
            </a>

            <!-- Visible byline + tag -->
            <div class="article-eyebrow">
                <span class="article-tag">{{region}}</span>
                <span class="article-byline-sep">·</span>
                <span class="article-byline-date">
                    By <a href="/about.html" rel="author" style="color:inherit">{{author|default:'POTUS Watch Editorial'}}</a>
                    · <time datetime="{{date}}">{{date|format:'%b %d, %Y'}}</time>
                </span>
            </div>

            <h1 class="article-title">{{title}}</h1>
            <hr class="article-rule">

            <div class="article-body">
                <!-- Server-render each paragraph of {{body}} as <p>...</p> here -->
                {{#paragraphs}}<p>{{.}}</p>{{/paragraphs}}
            </div>

            <!-- Sources -->
            {{#sources}}
            <div class="sources-section">
                <p class="sources-label">Sources</p>
                {{#sources}}<a href="{{url}}" target="_blank" rel="noopener nofollow">{{title}}</a>{{/sources}}
            </div>
            {{/sources}}

            <!-- Share buttons (your existing block) -->

            <!-- Related dispatches: render 3-5 articles with same region, excluding current -->
            <aside class="related-section" style="margin-top:48px;padding-top:28px;border-top:1px solid #1a1a1a">
                <p class="sources-label">Related dispatches</p>
                <ul style="list-style:none;padding:0">
                    <!-- {{#related}} <li><a href="/article/{{slug}}">{{title}}</a></li> {{/related}} -->
                </ul>
            </aside>
        </div>
    </article>

    <!-- Re-use homepage footer -->
</body>
</html>
