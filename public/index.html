<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>POTUS Watch</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900;1,700&family=Source+Serif+4:opsz,wght@8..60,300;8..60,400&family=JetBrains+Mono:wght@400;500&display=swap');
*{box-sizing:border-box;margin:0;padding:0}
:root{--ink:#0f0e0c;--paper:#f5f0e8;--paper2:#ede8dc;--red:#b01c1c;--muted:#6b6560;--border:#d8d0c4;--white:#fff}
body{font-family:'Source Serif 4',serif;background:var(--paper);color:var(--ink);min-height:100vh}
.masthead{background:var(--ink);text-align:center;padding:24px;border-bottom:3px solid var(--red)}
.masthead h1{font-family:'Playfair Display',serif;font-size:48px;font-weight:900;color:var(--paper)}
.masthead h1 em{color:var(--red)}
.masthead p{font-family:'JetBrains Mono',monospace;font-size:10px;color:#888;margin-top:6px;letter-spacing:2px}
.topbar{background:var(--red);padding:8px 24px;display:flex;align-items:center;gap:10px}
.live-dot{width:7px;height:7px;background:#fff;border-radius:50%;animation:blink 1s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.2}}
.ticker{font-family:'JetBrains Mono',monospace;font-size:10px;color:rgba(255,255,255,.85);flex:1;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.container{max-width:900px;margin:0 auto;padding:24px 16px}
.controls{display:flex;gap:10px;margin-bottom:24px;flex-wrap:wrap}
.btn{padding:10px 18px;border:none;border-radius:3px;font-family:'JetBrains Mono',monospace;font-size:11px;cursor:pointer;transition:background .2s}
.btn-red{background:var(--red);color:#fff}.btn-red:hover{background:#8a1515}
.btn-dark{background:var(--ink);color:var(--paper)}.btn-dark:hover{background:#333}
.btn:disabled{opacity:.4;cursor:not-allowed}
.status{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--muted);padding:10px 0;min-height:32px}
.article-card{background:var(--white);border:1px solid var(--border);border-radius:4px;padding:20px;margin-bottom:16px;cursor:pointer;transition:border-color .2s}
.article-card:hover{border-color:var(--red)}
.article-card.featured{border:2px solid var(--red)}
.card-meta{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.card-tag{font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:1px;text-transform:uppercase;padding:2px 7px;border-radius:2px;background:#fdecea;color:#9b2020}
.card-time{font-family:'JetBrains Mono',monospace;font-size:9px;color:var(--muted)}
.card-title{font-family:'Playfair Display',serif;font-size:22px;font-weight:700;line-height:1.25;margin-bottom:8px}
.card-excerpt{font-size:13px;line-height:1.6;color:var(--muted)}
.read-more{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--red);margin-top:8px;display:inline-block}
.modal-overlay{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.6);z-index:999;align-items:flex-start;justify-content:center;padding:40px 16px;overflow-y:auto}
.modal-overlay.open{display:flex}
.modal-inner{background:var(--paper);max-width:700px;width:100%;border-radius:4px;padding:40px 48px;position:relative}
.close-btn{position:absolute;top:16px;right:16px;background:none;border:1px solid var(--border);border-radius:3px;padding:4px 10px;cursor:pointer;font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--muted)}
.close-btn:hover{background:var(--paper2)}
.full-kicker{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--red);letter-spacing:1.5px;text-transform:uppercase;margin-bottom:12px}
.full-title{font-family:'Playfair Display',serif;font-size:32px;font-weight:900;line-height:1.2;margin-bottom:12px}
.full-byline{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--muted);border-top:1px solid var(--border);border-bottom:1px solid var(--border);padding:8px 0;margin-bottom:20px;display:flex;justify-content:space-between}
.full-body{font-size:15px;line-height:1.8;color:#2a2620}
.full-body p{margin-bottom:16px}
.full-body p:first-child::first-letter{font-family:'Playfair Display',serif;font-size:52px;font-weight:900;float:left;line-height:.8;margin:4px 8px 0 0;color:var(--red)}
.sources{margin-top:20px;padding-top:16px;border-top:1px solid var(--border)}
.sources h4{font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:1px;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
.sources a{display:block;font-size:12px;color:var(--red);margin-bottom:4px;text-decoration:none;font-family:'JetBrains Mono',monospace}
.sources a:hover{text-decoration:underline}
.empty{text-align:center;padding:60px 20px;color:var(--muted);font-style:italic}
.news-sources{background:var(--white);border:1px solid var(--border);border-radius:4px;padding:16px;margin-bottom:24px}
.news-sources h3{font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--muted);margin-bottom:10px}
.news-item{font-size:12px;padding:6px 0;border-bottom:.5px solid var(--border);color:var(--ink);line-height:1.4}
.news-item:last-child{border:none}
.news-item a{color:var(--red);font-size:10px;font-family:'JetBrains Mono',monospace;margin-left:8px;text-decoration:none}
</style>
</head>
<body>

<div class="masthead">
  <h1>POTUS <em>Watch</em></h1>
  <p>AI-Powered · Live News + Analysis · Self-Publishing</p>
</div>
<div class="topbar">
  <div class="live-dot"></div>
  <div class="ticker" id="ticker">Fetching latest Trump intelligence...</div>
</div>

<div class="container">
  <div class="controls">
    <button class="btn btn-red" id="fetch-btn" onclick="fetchAndGenerate()">⚡ Fetch news + generate analysis</button>
    <button class="btn btn-dark" onclick="clearAll()">Clear all articles</button>
  </div>
  <div class="status" id="status">Ready. Click Fetch to pull live news and generate analysis.</div>

  <div id="news-sources" style="display:none" class="news-sources">
    <h3>Live Sources Used</h3>
    <div id="news-list"></div>
  </div>

  <div id="feed">
    <div class="empty">No articles yet. Click Fetch above.</div>
  </div>
</div>

<div class="modal-overlay" id="modal" onclick="if(event.target.id==='modal')closeModal()">
  <div class="modal-inner">
    <button class="close-btn" onclick="closeModal()">✕ Close</button>
    <div class="full-kicker" id="m-kicker"></div>
    <div class="full-title" id="m-title"></div>
    <div class="full-byline"><span>AI Foreign Correspondent · POTUS Watch</span><span id="m-time"></span></div>
    <div class="full-body" id="m-body"></div>
    <div class="sources" id="m-sources"></div>
  </div>
</div>

<script>
let articles = [];

window.onload = () => {
  const saved = localStorage.getItem('pw-articles');
  if(saved){ articles = JSON.parse(saved); renderFeed(); }
};

function setStatus(msg){ document.getElementById('status').textContent = msg; }

const tickers = [
  'Trump extends Iran power plant strike pause — deadline passed',
  'Witkoff: strong and positive Iran talks — Tehran denies',
  'Trump-Xi summit expected April 2026 — grand bargain on Taiwan',
  'THAAD removed from South Korea — Seoul unable to block',
  '$23B emergency arms sales to UAE, Kuwait, Jordan fast-tracked',
  'Venezuela: Maduro in New York awaiting trial',
  'Liberation Day tariffs face Supreme Court challenge'
];
let ti = 0;
setInterval(()=>{ document.getElementById('ticker').textContent = tickers[ti++ % tickers.length]; }, 5000);
document.getElementById('ticker').textContent = tickers[0];

async function fetchAndGenerate(){
  document.getElementById('fetch-btn').disabled = true;
  setStatus('Step 1/3 — Fetching live Trump news...');

  let newsItems = [];
  try {
    const r = await fetch('/get-news');
    const d = await r.json();
    if(d.error) throw new Error(d.error);
    newsItems = d.articles.filter(a => a.title && a.description);

    document.getElementById('news-sources').style.display = 'block';
    document.getElementById('news-list').innerHTML = newsItems.map(a =>
      `<div class="news-item">${a.title} <a href="${a.url}" target="_blank">source →</a></div>`
    ).join('');

    setStatus('Step 2/3 — Sending to Claude for analysis...');
  } catch(e){
    setStatus('News error: ' + e.message);
    document.getElementById('fetch-btn').disabled = false;
    return;
  }

  const newsContext = newsItems.map((a,i) =>
    `Article ${i+1}: ${a.title}\n${a.description}`
  ).join('\n\n');

  try {
    const res = await fetch('/generate', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        model: 'claude-sonnet-4-20250514',
        max_tokens: 1500,
        messages: [{
          role: 'user',
          content: `You are an elite AI foreign policy correspondent for POTUS Watch. Today is April 2026.

Here are the latest real news headlines about Trump:

${newsContext}

Write a sharp analytical dispatch. Return ONLY valid JSON no markdown no backticks:
{
  "title": "provocative specific headline based on real news",
  "region": "one of: Iran / China / NATO / Americas / Mideast / Russia / Trade",
  "excerpt": "2-3 punchy lede sentences grounded in real news",
  "body": "6 paragraphs of serious analytical journalism. What is Trump's NEXT likely move and why. Be specific. Be bold."
}`
        }]
      })
    });

    const data = await res.json();
    if(data.error) throw new Error(JSON.stringify(data.error));
    const raw = data.content.filter(b => b.type === 'text').map(b => b.text).join('');
    const parsed = JSON.parse(raw.replace(/```json|```/g,'').trim());

    const now = new Date();
    const article = {
      id: Date.now(),
      title: parsed.title,
      region: parsed.region,
      excerpt: parsed.excerpt,
      body: parsed.body,
      time: now.getHours().toString().padStart(2,'0') + ':' + now.getMinutes().toString().padStart(2,'0'),
      date: now.toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'}),
      sources: newsItems.map(a => ({title: a.title, url: a.url}))
    };

    articles.unshift(article);
    localStorage.setItem('pw-articles', JSON.stringify(articles.slice(0,20)));
    renderFeed();
    setStatus('Dispatch filed. ' + articles.length + ' total articles.');

  } catch(e){
    setStatus('Claude error: ' + e.message);
  }

  document.getElementById('fetch-btn').disabled = false;
}

function renderFeed(){
  const f = document.getElementById('feed');
  if(!articles.length){ f.innerHTML = '<div class="empty">No articles yet. Click Fetch above.</div>'; return; }
  f.innerHTML = articles.map((a,i) => `
    <div class="article-card ${i===0?'featured':''}" onclick="openArticle(${a.id})">
      <div class="card-meta">
        <span class="card-tag">${a.region}</span>
        <span class="card-time">${a.date} · ${a.time}</span>
      </div>
      <div class="card-title">${a.title}</div>
      <div class="card-excerpt">${a.excerpt}</div>
      <span class="read-more">Read full dispatch →</span>
    </div>
  `).join('');
}

function openArticle(id){
  const a = articles.find(x => x.id === id);
  if(!a) return;
  document.getElementById('m-kicker').textContent = 'POTUS Watch · ' + a.region + ' Dispatch';
  document.getElementById('m-title').textContent = a.title;
  document.getElementById('m-time').textContent = a.date + ' · ' + a.time;
  document.getElementById('m-body').innerHTML = a.body.split('\n').filter(p=>p.trim()).map(p=>`<p>${p}</p>`).join('') || `<p>${a.body}</p>`;
  document.getElementById('m-sources').innerHTML = a.sources?.length ?
    `<h4>Sources Used</h4>${a.sources.map(s=>`<a href="${s.url}" target="_blank">${s.title}</a>`).join('')}` : '';
  document.getElementById('modal').classList.add('open');
  document.body.style.overflow = 'hidden';
}

function closeModal(){
  document.getElementById('modal').classList.remove('open');
  document.body.style.overflow = '';
}

function clearAll(){
  if(confirm('Delete all articles?')){ articles = []; localStorage.removeItem('pw-articles'); renderFeed(); setStatus('Cleared.'); }
}
</script>
</body>
</html>
